<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>GitHub 音乐盒</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">&#9835;</span>
    <h1>GitHub 音乐盒</h1>
  </div>
  <div class="topbar-actions">
    <button id="reloadBtn" class="icon-btn" title="重新扫描仓库" aria-label="重新扫描仓库">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>
</header>

<main class="content">
  <section class="banner" id="banner">
    <div class="banner-text">
      <h2 id="bannerTitle">设置你的 GitHub 音乐仓库</h2>
      <p id="bannerSub">填入仓库信息后即可在线播放仓库里的音乐</p>
    </div>
    <button id="bannerCta" class="primary-btn">打开设置</button>
  </section>

  <div class="toolbar">
    <input type="search" id="searchInput" class="search" placeholder="搜索曲目…" aria-label="搜索曲目">
    <span class="count" id="trackCount">0 首</span>
  </div>

  <ul class="playlist" id="playlist" aria-label="播放列表"></ul>
  <div class="empty" id="emptyState" hidden>
    <p>没有可播放的音乐文件</p>
    <p class="hint">请检查仓库地址与目录路径是否正确</p>
  </div>
</main>

<footer class="player" id="player">
  <div class="player-track">
    <img id="coverArt" class="cover" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23262a33'/><text x='32' y='40' font-size='26' text-anchor='middle' fill='%23888'>%E2%99%AB</text></svg>">
    <div class="track-meta">
      <div class="track-title" id="trackTitle">未播放</div>
      <div class="track-sub" id="trackSub"></div>
    </div>
  </div>

  <div class="player-center">
    <div class="controls">
      <button id="shuffleBtn" class="ctrl-btn" title="随机播放" aria-label="随机播放">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="prevBtn" class="ctrl-btn" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" class="play-btn" title="播放/暂停" aria-label="播放/暂停">
        <svg id="iconPlay" viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" width="30" height="30" style="display:none"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="nextBtn" class="ctrl-btn" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button id="repeatBtn" class="ctrl-btn" title="循环模式" aria-label="循环模式">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="seekbar">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" class="range" min="0" max="0" value="0" step="0.1" aria-label="进度">
      <span class="time" id="durTime">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button id="muteBtn" class="ctrl-btn" title="静音" aria-label="静音">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </button>
    <input type="range" id="volume" class="range vol" min="0" max="100" value="80" aria-label="音量">
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>仓库设置</h2>
      <button id="closeModalBtn" class="icon-btn" aria-label="关闭">&times;</button>
    </div>
    <form id="settingsForm">
      <label>
        <span>仓库所有者 (Owner) *</span>
        <input type="text" id="setOwner" required placeholder="例如 octocat" autocomplete="off">
      </label>
      <label>
        <span>仓库名称 (Repo) *</span>
        <input type="text" id="setRepo" required placeholder="例如 my-music" autocomplete="off">
      </label>
      <label>
        <span>分支 (可留空自动检测)</span>
        <input type="text" id="setBranch" placeholder="例如 main" autocomplete="off">
      </label>
      <label>
        <span>音乐目录 (留空为仓库根目录)</span>
        <input type="text" id="setPath" placeholder="例如 music / 专辑1" autocomplete="off">
      </label>
      <label>
        <span>访问令牌 (私有仓库必填，仅存于本地浏览器)</span>
        <input type="password" id="setToken" placeholder="ghp_…" autocomplete="off">
      </label>
      <div class="modal-foot">
        <span class="form-error" id="formError"></span>
        <button type="submit" class="primary-btn">保存并加载</button>
      </div>
    </form>
    <p class="hint modal-hint">说明：播放器通过 GitHub API 读取仓库中的音频文件并在线播放，适用于 GitHub Pages 免费托管。令牌只会保存在你自己的浏览器 localStorage 中，不会上传到任何服务器。</p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
